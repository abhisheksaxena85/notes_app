  <!-- Bottom Brand Footnote -->
  <g id="SplashFooterDark">
    <text x="195" y="784" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4" fill="#8A948C" text-anchor="middle">A CALM SPACE FOR YOUR THOUGHTS</text>
    <text x="195" y="802" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" fill="#525B54" text-anchor="middle">DAYMARK · VERSION 1.0.0</text>
