<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Faded Backdrop -->
  <rect width="390" height="844" fill="#000000" fill-opacity="0.38"/>
  
  <!-- Bottom Sheet Surface -->
  <g id="BottomSheet">
    <path d="M0 136C0 121.641 11.6406 110 26 110H364C378.359 110 390 121.641 390 136V844H0V136Z" fill="#F6F7F5"/>
    
    <!-- Drag Handle -->
    <rect x="176" y="122" width="38" height="4" rx="2" fill="#E8ECE8"/>

    <!-- Header Row -->
    <text x="24" y="166" font-family="Inter, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#252A27">New note</text>
    
    <!-- Pin Button -->
    <rect x="334" y="142" width="36" height="36" rx="18" fill="#FFFFFF" stroke="#E8ECE8" stroke-width="1"/>
    <path d="M348 152L356 160M350 150L358 158M346 154L352 160L348 164L342 158L346 154ZM342 158L338 162" stroke="#858D87" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Title Input Field -->
    <rect x="20" y="190" width="350" height="50" rx="16" fill="#FFFFFF" stroke="#E8ECE8" stroke-width="1"/>
    <text x="36" y="221" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#252A27">Sprint Planning Notes</text>

    <!-- Content Multiline Field -->
    <rect x="20" y="252" width="350" height="230" rx="16" fill="#FFFFFF" stroke="#E8ECE8" stroke-width="1"/>
    <text x="36" y="284" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#252A27">Review architecture proposal for the offline cache sync.</text>
    <text x="36" y="308" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#252A27">Key priorities discussed:</text>
    <text x="36" y="332" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#858D87">• Implement atomic queue for local changes</text>
    <text x="36" y="356" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#858D87">• Add re-entrant lock on sync service</text>
    <text x="36" y="380" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#858D87">• Design verification tests in memory DB</text>

    <!-- Tags Section -->
    <text x="24" y="510" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1.2" fill="#858D87">TAGS</text>
    
    <!-- Add Tag Field -->
    <rect x="20" y="522" width="298" height="42" rx="14" fill="#FFFFFF" stroke="#E8ECE8" stroke-width="1"/>
    <text x="34" y="548" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#858D87">Add a tag...</text>
    
    <!-- Add Tag Button -->
    <rect x="326" y="522" width="44" height="42" rx="14" fill="#EAF0EB"/>
    <path d="M342 543H354M348 537V549" stroke="#5E7668" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Tag Chips Row -->
    <g id="ActiveTags">
      <!-- Tag 1 -->
      <rect x="20" y="574" width="76" height="28" rx="14" fill="#EAF0EB"/>
      <text x="42" y="592" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5E7668">Work</text>
      <path d="M72 585L78 591M78 585L72 591" stroke="#5E7668" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Tag 2 -->
      <rect x="104" y="574" width="94" height="28" rx="14" fill="#EAF0EB"/>
      <text x="126" y="592" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5E7668">Planning</text>
      <path d="M178 585L184 591M184 585L178 591" stroke="#5E7668" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Tag 3 -->
      <rect x="206" y="574" width="82" height="28" rx="14" fill="#EAF0EB"/>
      <text x="228" y="592" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5E7668">Sprint</text>
      <path d="M268 585L274 591M274 585L268 591" stroke="#5E7668" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Save Note Action Button -->
    <rect x="20" y="746" width="350" height="52" rx="18" fill="#252A27"/>
    <text x="195" y="778" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save note</text>
  </g>
</svg>