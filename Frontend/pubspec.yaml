name: notes_app
description: "Daymark: offline-first notes, tasks and reminders with a Spring Boot backend."
publish_to: 'none'

# build-name (versionName / CFBundleShortVersionString) + build number
# (versionCode / CFBundleVersion). Override with --build-name / --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.5
  get_it: ^9.3.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_screenutil: ^5.9.3
  json_annotation: ^4.12.0
  internet_connection_checker: ^3.0.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.5.1
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
dev_dependencies:
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
