# Local development profile.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Required environment variables (export them, or put them in Backend/.env,
# which is gitignored and loaded below):
#   DB_PASSWORD  local MySQL password (required)
#   DB_USER      local MySQL user (optional, defaults to root)
# Prod (default profile) instead reads MYSQLHOST, MYSQLPORT, MYSQLDATABASE,
# MYSQLUSER and MYSQLPASSWORD. Never put real credentials in this file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/notes_application?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
