spring.application.name=notes_app

# Hosts such as Railway inject PORT; locally and in Docker it defaults to 8080.
server.port=${PORT:8080}

# Database: values come from the environment only, never from this file.
# Prod (default profile) uses the MYSQL* variables provided by the host.
# For local development use the dev profile (application-dev.properties).
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Schema migrations (Flyway). Existing databases are baselined at version 1, so
# the first real migration is V2. Hibernate still manages the other tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Use X-Forwarded-For from the hosting proxy for request.getRemoteAddr(), so the
# login rate limiter counts real client IPs. Tomcat only trusts it from
# internal proxy addresses.
server.forward-headers-strategy=native

# Login brute-force protection (failed attempts per window).
app.auth.login.max-failures-per-email=10
app.auth.login.max-failures-per-ip=50
app.auth.login.window-minutes=15

# SEC-01: JWT access tokens (HS256). JWT_SECRET must be at least 32 bytes; the
# app refuses to start without it (except under the dev profile).
app.auth.jwt.secret=${JWT_SECRET:}
app.auth.jwt.ttl=7d
# Rollout switch. false: tokens are issued, and checked when a request sends
# one, but requests without a token still work (app builds from before SEC-02).
# true: every data route needs a valid token. Flip once everyone runs SEC-02.
app.auth.enforced=${AUTH_ENFORCED:false}
