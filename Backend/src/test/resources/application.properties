spring.application.name=notes_app

# Test-only datasource: in-memory H2 in MySQL compatibility mode, so the
# suite does not depend on the MYSQL* environment variables used in prod.
spring.datasource.url=jdbc:h2:mem:notes_app_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tests build the schema with ddl-auto; Flyway migrations are covered by
# EmailMigrationTests, which runs them against its own H2 database.
spring.flyway.enabled=false
